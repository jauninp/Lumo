/* Direct writing and insertion: stable row geometry, generous mouse targets. */
.fold-slot{display:block;flex:0 0 19px;width:19px}

.add-block:hover{background:#f1f5ed;color:var(--accent)}

.editor[data-heading="2"]{font-size:22px;font-weight:650;line-height:1.4;letter-spacing:-.3px}
.editor[data-heading="3"]{font-size:18px;font-weight:650;line-height:1.4;letter-spacing:-.3px}
.backlinks{margin-top:28px}
.license-copy{font:11px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
@media(pointer:coarse){.block-row{margin-top:10px}}

.rendered pre code{padding:0;background:none}
.rendered blockquote{border-left:3px solid #9bb29b;margin:8px 0;padding:3px 14px;color:#657a68}

  function exportMarkdown() {
    const page = graph.page(view.id), lines = ['# ' + page.title, '', ...Object.entries(page.properties||{}).map(([k,v])=>k+':: '+v), ''];
    const stack = graph.children(page.id).reverse().map(block => ({ block, depth: 0 }));
    while (stack.length) {
      const { block, depth } = stack.pop(), text = block.text.split('\n'), indent = '  '.repeat(depth);
      lines.push(indent + '- ' + text[0], ...text.slice(1).map(line => indent + '  ' + line));
      for (const child of graph.children(page.id, block.id).reverse()) stack.push({ block: child, depth: depth + 1 });
    }
    const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob), link = document.createElement('a'); link.href = url;
    link.download = page.title.replace(/[<>:"/\\|?*\x00-\x1f]/g, '-') + '.md'; link.click(); setTimeout(() => URL.revokeObjectURL(url), 10000);

  async function importFile(file) {
    if (!file) return;
    try {
      if (file.size > 25 * 1024 * 1024) throw new Error('Le fichier dépasse la limite de 25 Mo de cette version.');
      const data = validate(JSON.parse(await file.text()));
      showDialog('Restaurer cette sauvegarde ?', `<p><b>${data.pages.length} pages et ${data.blocks.length} blocs</b> validés.</p><p>La restauration remplacera les notes actuelles. Téléchargez d’abord une copie de votre espace si vous souhaitez le conserver.</p><div class="dialog-actions"><button data-action="export">Exporter l’espace actuel</button><button id="restore-confirm" class="primary">Remplacer et restaurer</button></div>`);
      $('#restore-confirm').onclick = async () => {
        if (importing) return; importing = true;
        clearTimeout(saveTimer);
        const button = $('#restore-confirm'); button.disabled = true; button.textContent = 'Restauration…';
        try {
          if (!storageAvailable) throw new Error('IndexedDB indisponible : restauration impossible.');
          // Wait for preceding saves before committing the replacement atomically.
          while (saving) await new Promise(resolve => setTimeout(resolve, 20));
          const replacement = new Graph(structuredClone(data));
          await Storage.save(replacement.snapshot());
          graph = replacement; revision++; savedRevision = revision; undo = []; redo = [];
          $('#save-status').textContent = '✓ Restauration enregistrée'; notice(''); dialog.close();
          pendingDeletions.forEach(p => { clearTimeout(p.timer); p.toast.remove(); }); pendingDeletions.clear();
          openJournal();
        } catch (error) { notice('Restauration non effectuée. ' + error.message); button.disabled = false; button.textContent = 'Réessayer'; }
        finally { importing = false; if (revision !== savedRevision) saveTimer = setTimeout(flush, 0); }
      };
    } catch (error) { showDialog('Import impossible', `<p>${esc(error.message)}</p><p>Votre espace actuel est conservé.</p><div class="dialog-actions"><button data-action="close" class="primary">Fermer</button></div>`); }
  }

    'toggle-recents': () => { graph.settings.recentsCollapsed = !graph.settings.recentsCollapsed; changed(); renderSidebar(); },
    'toggle-favorite': () => {
      if (view.type !== 'page') return;
      const favorites = graph.settings.favorites || [];
      graph.settings.favorites = favorites.includes(view.id) ? favorites.filter(id => id !== view.id) : [...favorites, view.id];
      changed(); renderSidebar();
    },
    today: () => openJournal(), pages: () => { view = { type: 'pages' }; render(); }, tasks: () => { view = { type: 'tasks' }; render(); },
    tags: () => { view = { type: 'tags' }; render(); },
    queries: search,
    capture: () => { dialog.close(); openJournal(); appendBlock(); },
    'close-search': closeSearch, 'query-help': queryHelp, 'save-query': () => saveQuery(searchPlan().expression), 'save-task-query': () => saveQuery(taskExpression()), 'export-markdown': exportMarkdown,
    search, 'new-page': newPage, help, backup,
    about: () => {
      showDialog('À propos de MiniSeq', '<p>MiniSeq inclut une adaptation JavaScript de la logique d’insertion de Logseq 0.10.9, par les contributeurs de Logseq. Adaptation MiniSeq : 8 septembre 2026.</p><p>Ce logiciel est distribué sous GNU AGPL version 3, sans garantie. Vous pouvez le modifier et le redistribuer sous les conditions de cette licence. Les sources lisibles sont présentes dans ce HTML ; les fichiers de développement accompagnent le projet.</p><p>Source d’origine : github.com/logseq/logseq, version 0.10.9, src/main/frontend/handler/editor.cljs.</p><details><summary>Lire la licence GNU AGPL v3</summary><pre class="license-copy"></pre></details>');
      $('.license-copy').textContent = $('#license-text').content.textContent + '\n\nMarked 15.0.12 (MIT)\n' + $('#marked-license').content.textContent + '\n\nTabulator 6.3.0 (MIT)\n' + $('#tabulator-license').content.textContent;
    },
    close: () => { if (!importing) dialog.close(); },
    menu: () => document.body.classList.toggle(innerWidth <= 650 ? 'mobile-menu' : 'menu-hidden'),
    export: () => { finishEdit(); download(graph.snapshot()); }, import: () => $('#import-file').click(),
    'add-block': appendBlock,
    'older-journals': loadOlderJournals,
    previous: () => shiftDay(-1), next: () => shiftDay(1)
  };
  function shiftDay(delta) {
    const d = new Date(graph.page(view.id).journalDate + 'T12:00:00'); d.setDate(d.getDate() + delta); openJournal(dateKey(d));
  }
  let blockMenu = null;
  function closeBlockMenu() { blockMenu?.remove(); blockMenu = null; }
  function floatingMenu(rect, title) {
    closeBlockMenu(); finishEdit();
    const menu = document.createElement('div'); menu.className = 'block-menu'; menu.setAttribute('role', 'dialog'); menu.setAttribute('aria-label', title);
    const heading = document.createElement('div'); heading.className = 'block-menu-title'; heading.textContent = title; menu.append(heading);
    (searchDialog.open ? searchDialog : document.body).append(menu); blockMenu = menu;
    menu.style.left = Math.min(rect.left, innerWidth - 280) + 'px'; menu.style.top = Math.min(rect.bottom + 4, innerHeight - 340) + 'px';
    menu.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault();e.stopPropagation();closeBlockMenu(); return; } if (['ArrowDown', 'ArrowUp'].includes(e.key)) { e.preventDefault(); const buttons = [...menu.querySelectorAll('button')]; buttons[(buttons.indexOf(document.activeElement) + (e.key === 'ArrowDown' ? 1 : -1) + buttons.length) % buttons.length]?.focus(); } });
    return menu;
  }
  function menuButton(menu, label, action, className = '') {
    const button = document.createElement('button'); button.type = 'button'; button.textContent = label; button.className = className;
    button.onclick = e => { e.stopPropagation(); action(); }; menu.append(button); return button;
  }
  function showStatusMenu(id, rect) {
    const menu = floatingMenu(rect, 'Définir le statut');
    const current = MiniQuery.metadata(graph.block(id).text).status;
    for (const [status, label, icon] of taskStates) {
      const button = menuButton(menu, icon + ' ' + label, () => {
        const b = graph.block(id); if (!b) return;
        const meta = MiniQuery.metadata(b.text);
        checkpoint(); graph.setText(id, MiniQuery.updateTask(b.text, { status, priority: meta.priority || '', deadline: meta.deadline || '' }));
        closeBlockMenu(); changed(); if (view.type === 'page') renderBlocks(); refreshQueries();
      }, 'status-option status-' + status);
      button.dataset.status = status; button.setAttribute('aria-pressed', String(status === current));
    }
    menu.querySelector('button').focus();
  }
  document.addEventListener('pointerdown', e => { if (blockMenu && !blockMenu.contains(e.target)) closeBlockMenu(); });
  document.addEventListener('contextmenu', e => {
    const bullet = e.target.closest('.bullet'); if (!bullet || !graph) return;
    e.preventDefault(); const id = bullet.dataset.zoom;
    const menu = floatingMenu({ left: e.clientX, bottom: e.clientY }, 'Mettre en forme');
    const apply = fn => { const b = graph.block(id); if (!b) return; checkpoint(); fn(b);b.updatedAt=new Date().toISOString();graph.page(b.pageId).updatedAt=b.updatedAt; closeBlockMenu(); changed(); renderBlocks(); };
    const colors = document.createElement('div'); colors.className = 'format-options'; menu.append(colors);
    for (const [value, label] of [['yellow', 'Jaune'], ['red', 'Rouge'], ['pink', 'Rose'], ['green', 'Vert'], ['blue', 'Bleu'], ['purple', 'Violet'], ['gray', 'Gris'], ['', 'Sans couleur']]) {
      const button = menuButton(colors, '●', () => apply(b => { b.color = value; }), 'color-choice'); button.dataset.color = value; button.title = label; button.setAttribute('aria-label', label);
    }
    const icons = document.createElement('div'); icons.className = 'format-options'; menu.append(icons);
    for (const icon of ['⭐', '💡', '📌', '⚠️', '✅', '📅', '']) menuButton(icons, icon || 'Sans icône', () => apply(b => { b.icon = icon; }));
    menuButton(menu, '📌 Épingler à une page / projet…', () => choosePin(id));
    menuButton(menu, 'Définir un statut…', () => showStatusMenu(id, bullet.getBoundingClientRect()));
    menu.querySelector('button').focus();
  });
  let draggedBlock = null, dropTarget = null, suppressBulletClickUntil = 0;
  function clearDropTarget() {
    document.querySelectorAll('.drop-before,.drop-after,.drop-inside').forEach(row => { row.classList.remove('drop-before', 'drop-after', 'drop-inside'); row.style.removeProperty('--drop-depth'); });
    dropTarget = null;
  }
  function endBlockDrag() {
    clearDropTarget(); document.body.classList.remove('dragging-block');
    document.querySelectorAll('.drag-source').forEach(row => row.classList.remove('drag-source'));
    draggedBlock = null;
  }
  document.addEventListener('dragstart', e => {
    const bullet = e.target.closest('.bullet'); if (!bullet || !graph || importing) return;
    finishEdit(); draggedBlock = bullet.dataset.zoom;
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', draggedBlock);
    document.body.classList.add('dragging-block'); bullet.closest('.block-row').classList.add('drag-source');
  });
  document.addEventListener('dragover', e => {
    if (!draggedBlock) return;
    clearDropTarget(); const row = e.target.closest('.block-row'); if (!row) return;
    const rect = row.getBoundingClientRect(), bullet = row.querySelector('.bullet').getBoundingClientRect();
    let target = graph.block(row.dataset.block);
    let placement = e.clientY < rect.top + rect.height / 3 ? 'before' : e.clientX > bullet.right + 18 ? 'inside' : 'after';
    // Moving left selects an ancestor level; moving right nests under the target.
    let levels = Math.max(0, Math.floor((bullet.left - e.clientX + 15) / 30));
    while (levels-- > 0 && target?.parentId) { target = graph.block(target.parentId); if (placement === 'inside') placement = 'after'; }
    let ancestor = target;
    while (ancestor) { if (ancestor.id === draggedBlock) return; ancestor = graph.block(ancestor.parentId); }
    if (!target) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    const targetRow = row.parentElement.querySelector(`[data-block="${target.id}"]`) || row;
    let markerRow = targetRow;
    if (placement === 'after') {
      let next = targetRow.nextElementSibling;
      while (next && Number(next.style.getPropertyValue('--depth')) > Number(targetRow.style.getPropertyValue('--depth'))) { markerRow = next; next = next.nextElementSibling; }
    }
    markerRow.style.setProperty('--drop-depth', targetRow.style.getPropertyValue('--depth'));
    markerRow.classList.add('drop-' + placement);
    dropTarget = { id: target.id, placement };
  });
  document.addEventListener('drop', e => {
    if (!draggedBlock) return;
    e.preventDefault();
    const source = draggedBlock, target = dropTarget;
    suppressBulletClickUntil = performance.now() + 350;
    endBlockDrag();
    if (!target) return;
    checkpoint();
    if (graph.relocate(source, target.id, target.placement)) {
      if (target.placement === 'inside') referenceFolds.set(target.id, false);
      changed(); renderBlocks(); refreshQueries();
    }
  });
  document.addEventListener('dragend', () => { if (draggedBlock) suppressBulletClickUntil = performance.now() + 350; endBlockDrag(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && draggedBlock) endBlockDrag(); });
  document.addEventListener('click', e => {
    if (!graph || importing) return;
    if (e.target.closest('a')) return;
    const el = e.target.closest('button, [data-edit]'); if (!el) return;
    const d = el.dataset;
    if (d.action) actions[d.action]?.();
    else if (d.page || d.pageName || d.jump) {
      dialog.close();
      if (d.jump) openBlock(d.jump);
      else if (d.pageName) { const before = graph.pages.length, p = graph.ensurePage(d.pageName); if (before !== graph.pages.length) changed(); openPage(p.id); }
      else openPage(d.page);
    } else if (d.tag) { dialog.close(); view = { type: 'tag', tag: d.tag }; render(); }
    else if (d.context) { const b=graph.block(d.context); if(b) openPage(b.pageId,b.id); }
    else if (d.person) { dialog.close(); view={type:'person',person:key(d.person)};render();window.scrollTo(0,0); }
    else if (d.unpin) { checkpoint(); graph.settings.pagePins[view.id]=pinIds(view.id).filter(id=>id!==d.unpin);changed();renderPins(); }
    else if (d.deletePage) deletePage(d.deletePage);
    else if (d.restorePage) restoreDeletedPage(d.restorePage);
    else if (d.zoom) { if (performance.now() >= suppressBulletClickUntil) openBlock(d.zoom); }
    else if (d.taskDetails) taskDetails(d.taskDetails);
    else if (d.queryExample) { explorerQuery = d.queryExample; searchMode='auto'; $('#global-search').value=explorerQuery;$('#search-input').value=explorerQuery;$('#search-mode').value=searchMode;refreshSearch(); }
    else if (d.task) showStatusMenu(d.task, el.getBoundingClientRect());
    else if (d.fold) { toggleFold(d.fold, el); renderBlocks(); }
    else if (d.edit) {
      const selection = window.getSelection();
      if (selection && !selection.isCollapsed && el.contains(selection.anchorNode)) return;
      edit(d.edit, clickedCursor(e, el), el.closest(".block-row")?.querySelector(".block-body"));
    }
    else if (d.up || d.down || d.indent || d.outdent) {
      const id = d.up || d.down || d.indent || d.outdent; checkpoint();
      if (d.up || d.down) graph.move(id, d.up ? -1 : 1); else graph.indent(id, !!d.outdent);
      changed(); renderBlocks(id);
    } else if (d.move) {
      showDialog('Déplacer le bloc et ses enfants', `<label for="move-page">Page de destination</label><p><select id="move-page">${graph.pages.filter(p => p.id !== view.id).map(p => `<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select></p><div class="dialog-actions"><button data-action="close">Annuler</button><button class="primary" id="move-confirm" ${graph.pages.length < 2 ? 'disabled' : ''}>Déplacer</button></div>`);
      $('#move-confirm').onclick = () => { const pageId = $('#move-page').value; checkpoint(); graph.moveToPage(d.move, pageId); changed(); dialog.close(); openPage(pageId, d.move); };
    }
  });
  document.addEventListener('change', e => {
    if (e.target.id.startsWith('task-') && ['task-state', 'task-deadline', 'task-priority'].includes(e.target.id)) {
      taskFilter[e.target.id.slice(5)] = e.target.value; $('#task-expression').textContent = taskExpression(); refreshQueries();
    }
    if (e.target.id === 'journal-date') openJournal(e.target.value);
    if (e.target.id === 'import-file') { importFile(e.target.files[0]); e.target.value = ''; }
  });
  document.addEventListener('keydown', e => {
    if (!graph || importing || e.isComposing) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); search(); }
    else if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'n') { e.preventDefault(); actions.capture(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); flush(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'z' || e.key.toLowerCase() === 'y') && !dialog.open && !searchDialog.open && e.target.id !== 'global-search') { e.preventDefault(); history(e.shiftKey || e.key.toLowerCase() === 'y'); }
    else if (e.key === 'Enter' && e.target.matches('.rendered')) { e.preventDefault(); edit(e.target.dataset.edit, null, e.target.closest('.block-body')); }
    else if (dialog.open && e.target.matches('.search-results button') && ['ArrowDown', 'ArrowUp'].includes(e.key)) {
      e.preventDefault(); (e.key === 'ArrowDown' ? e.target.nextElementSibling : e.target.previousElementSibling)?.focus();
    }
  });
  dialog.addEventListener('cancel', e => { if (importing) e.preventDefault(); });
  window.addEventListener('beforeunload', e => { if (revision !== savedRevision || importing) { if (!importing) flush(); e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('visibilitychange', () => { if (!graph) return; if (document.hidden) flush(); else refreshQueries(); });
  setInterval(() => { if (graph && !document.hidden) refreshReminders(); }, 60000);
  async function start() {
    try {
      const data = await Storage.open();
      graph = new Graph(validate({ format: 'miniseq', version: 1, ...data })); storageAvailable = true;
      if (savedRevision === revision) $('#save-status').textContent = '✓ Enregistré sur cet appareil';
    } catch (error) {
      graph = new Graph();
      notice('Le stockage local est indisponible. Cette session reste temporaire : exportez vos notes avant de fermer. ' + error.message);
    }
    if (!readRoute()) openJournal();
  }
  // A held Web Lock prevents a second tab from overwriting a newer notebook.
  if (navigator.locks) {
    navigator.locks.request('miniseq-writer-v1', { ifAvailable: true }, async lock => {
      if (!lock) {
        $('#save-status').textContent = 'Espace déjà ouvert';
        $('#main').innerHTML = '<h1>Votre espace est déjà ouvert.</h1><p class="empty">Fermez l’autre fenêtre MiniSeq puis rechargez celle-ci pour reprendre vos notes.</p>'; return;
      }
      await start(); await new Promise(() => {});
    }).catch(error => notice('Ouverture impossible : ' + error.message));
  } else {
    $('#save-status').textContent = 'Navigateur incompatible';
    $('#main').innerHTML = '<h1>Ouvrez MiniSeq dans Edge ou Chromium.</h1><p class="empty">Cette version a besoin de Web Locks pour protéger vos notes entre plusieurs fenêtres.</p>';
  }
})();
</script>
